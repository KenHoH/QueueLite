name: Build and Deploy Frontend and Backend

on:
    push:
        branches:
            - "main"
        paths:
            - "backend/**"
            - "frontend/**"
            - "compose*.yml"
            - ".github/workflows/**"

env:
    DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    IMAGE_TAG: ${{ github.sha }}

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Login to dockerhub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push to dockerhub
              uses: docker/build-push-action@v5
              with:
                  context: ./backend
                  file: ./backend/Dockerfile
                  push: true
                  tags: |
                      ${{ env.DOCKERHUB_NAMESPACE }}/queuelite-backend:${{ env.IMAGE_TAG }}

            - name: Build and push to dockerhub
              uses: docker/build-push-action@v5
              with:
                  context: ./frontend
                  file: ./frontend/Dockerfile
                  push: true
                  tags: |
                      ${{ env.DOCKERHUB_NAMESPACE }}/queuelite-frontend:${{ env.IMAGE_TAG }}

    deploy:
        needs: build
        name: Deploy image on OCI compute instance
        runs-on: ubuntu-latest

        steps:
            - name: install ssh keys
              run: |
                  install -m 600 -D /dev/null ~/.ssh/id_ed25519
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
                  ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts
            - name: connect and pull
              run: |
                  ssh centos@${{ secrets.SSH_HOST }} "cd ${{ secrets.WORK_DIR }} &&
                  DOCKERHUB_NAMESPACE='${{ env.DOCKERHUB_NAMESPACE }}' IMAGE_TAG='${{ env.IMAGE_TAG }}' docker compose down &&
                  DOCKERHUB_NAMESPACE='${{ env.DOCKERHUB_NAMESPACE }}' IMAGE_TAG='${{ env.IMAGE_TAG }}' docker compose pull &&
                  DOCKERHUB_NAMESPACE='${{ env.DOCKERHUB_NAMESPACE }}' IMAGE_TAG='${{ env.IMAGE_TAG }}' docker compose up -d --remove-orphans"
            - name: cleanup
              run: rm -rf ~/.ssh
